[cache]
read-url = "https://pub-cf9929c86d0144829e53d5e9f66d3060.r2.dev"
endpoint = "https://9a5426ad4c05881db7cff829de5f13e4.r2.cloudflarestorage.com"
bucket = "corgi-build-cache"

[extra-inputs]
# Integration tests execute these files; edits must invalidate cached test passes.
corgi-build = ["tests/support/*.py"]

# Release builds embed the pinned Metal and llvm-tools sha256 digests at compile
# time (CI sets these), hard-pinning the downloads. inherit forwards each var
# only when present, so dev builds (where they are unset) contribute nothing and
# the env!() pin, gated on debug_assertions, is never reached.
[env.CORGI_METAL_SHA256]
inherit = true
packages = ["corgi-build"]

[env.CORGI_LLVM_TOOLS_SHA256]
inherit = true
packages = ["corgi-build"]
