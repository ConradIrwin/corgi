name: Prepare Corgi toolchain assets

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: corgi-toolchain-assets
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref_type == 'branch'
    runs-on: macos-15
    steps:
      # Dispatch this workflow on the reviewed branch containing the new pins.
      - name: Check out proposed toolchain pins
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Ensure Metal release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
          DRY_RUN: "0"
        run: python3 ci/build-metal.py

      - name: Ensure llvm-tools release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
        run: ./ci/build-libclang.sh

  # The Linux artifact's verification loads libclang, so it needs a native
  # runner.
  prepare-linux:
    if: github.ref_type == 'branch'
    strategy:
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out proposed toolchain pins
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install zstd
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Ensure Linux llvm-tools release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
          PLATFORM: ${{ matrix.platform }}
        run: ./ci/build-libclang.sh
