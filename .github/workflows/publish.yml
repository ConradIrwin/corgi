name: Publish Corgi

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish Corgi
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Verify release tag
        id: version
        run: |
          set -euo pipefail
          version="$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["package"]["version"])')"
          test "$GITHUB_REF_NAME" = "v${version}"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Ensure Metal release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
          DRY_RUN: "0"
        run: python3 ci/build-metal.py

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      # Corgi provisions these llvm-tools (libclang plus dsymutil)
      # unconditionally on Apple hosts, so a released Corgi is only functional
      # once the artifact for the pinned Zig version exists. Reconcile it before
      # building: the script is idempotent and exits in seconds when the artifact
      # is already published, and only does real work (and installs zstd) after a
      # Zig bump.
      - name: Ensure llvm-tools release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
        run: ./ci/build-libclang.sh

      - name: Build Corgi
        run: cargo build --locked

      - name: Configure private cache reads
        env:
          CORGI_R2_ACCESS_KEY_ID: ${{ secrets.CORGI_R2_ACCESS_KEY_ID }}
          CORGI_R2_SECRET_ACCESS_KEY: ${{ secrets.CORGI_R2_SECRET_ACCESS_KEY }}
        run: python3 ci/configure-cache-credentials.py

      - name: Run tests and populate the cache
        env:
          CORGI_R2_WRITE_URL: https://9a5426ad4c05881db7cff829de5f13e4.r2.cloudflarestorage.com/corgi-build-cache
          CORGI_R2_ACCESS_KEY_ID: ${{ secrets.CORGI_R2_ACCESS_KEY_ID }}
          CORGI_R2_SECRET_ACCESS_KEY: ${{ secrets.CORGI_R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          : "${CORGI_R2_ACCESS_KEY_ID:?Configure the bucket-scoped R2 access key}"
          : "${CORGI_R2_SECRET_ACCESS_KEY:?Configure the bucket-scoped R2 secret key}"
          ./target/debug/corgi cache test

      - name: Build release asset
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          target="aarch64-apple-darwin"
          host="$(rustc -vV | sed -n 's/^host: //p')"
          test "$host" = "$target"

          ./target/debug/corgi build --release

          asset="corgi-${target}.tar.gz"
          mkdir -p dist/archive dist/verify
          cp target/release/corgi dist/archive/corgi
          strip dist/archive/corgi
          codesign --verify dist/archive/corgi
          COPYFILE_DISABLE=1 tar -czf "dist/${asset}" -C dist/archive corgi
          (
            cd dist
            shasum -a 256 "$asset" > "${asset}.sha256"
          )

          tar -xzf "dist/${asset}" -C dist/verify
          test "$(dist/verify/corgi --version)" = "corgi ${VERSION}"

      - name: Recreate draft GitHub release from the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if existing="$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [ "$existing" != true ]; then
              echo "Refusing to replace the published release $tag" >&2
              exit 1
            fi
            # A previous attempt may have left a draft with assets from another
            # build. Delete the draft, but keep the immutable release tag.
            gh release delete "$tag" --yes
          fi
          asset="corgi-aarch64-apple-darwin.tar.gz"
          gh release create "$tag" \
            "dist/${asset}" \
            "dist/${asset}.sha256" \
            --draft \
            --verify-tag \
            --target "$GITHUB_SHA" \
            --title "Corgi ${VERSION}" \
            --notes "Automated Corgi release ${VERSION}."

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish ${{ steps.version.outputs.version }}
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release edit "v${VERSION}" --draft=false
