name: Publish Corgi

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish Corgi
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Set per-push version
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          version="0.1.${RUN_NUMBER}"
          python3 - "$version" <<'PY'
          import pathlib
          import re
          import sys

          manifest = pathlib.Path("Cargo.toml")
          contents = manifest.read_text()
          contents, replacements = re.subn(
              r'(?m)^(version = ")[^"]+(")$',
              rf'\g<1>{sys.argv[1]}\g<2>',
              contents,
              count=1,
          )
          if replacements != 1:
              raise SystemExit("could not update package version in Cargo.toml")
          manifest.write_text(contents)
          PY
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build Corgi and update lockfile
        run: cargo build

      - name: Run tests
        run: ./target/debug/corgi test

      - name: Build release asset
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          target="aarch64-apple-darwin"
          host="$(rustc -vV | sed -n 's/^host: //p')"
          test "$host" = "$target"

          ./target/debug/corgi build --release

          asset="corgi-${target}.tar.gz"
          mkdir -p dist/archive dist/verify
          cp target/release/corgi dist/archive/corgi
          strip dist/archive/corgi
          codesign --verify dist/archive/corgi
          COPYFILE_DISABLE=1 tar -czf "dist/${asset}" -C dist/archive corgi
          (
            cd dist
            shasum -a 256 "$asset" > "${asset}.sha256"
          )

          tar -xzf "dist/${asset}" -C dist/verify
          test "$(dist/verify/corgi --version)" = "corgi ${VERSION}"

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          asset="corgi-aarch64-apple-darwin.tar.gz"
          gh release create "v${VERSION}" \
            "dist/${asset}" \
            "dist/${asset}.sha256" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Corgi ${VERSION}" \
            --notes "Automated Corgi release ${VERSION}."

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish ${{ steps.version.outputs.version }}
        run: cargo publish --locked --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release edit "v${VERSION}" --draft=false
