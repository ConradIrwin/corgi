name: Publish Corgi

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  # Builds the Linux release assets. The macOS job attaches them to the draft
  # release, so the release, crates.io, and publication steps run once. Each
  # target builds on a native runner, which also verifies its libclang loads.
  build-linux:
    name: Build ${{ matrix.target }} release asset
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            llvm_platform: linux-x64
            llvm_sha256_variable: CORGI_LLVM_TOOLS_SHA256_LINUX_X64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            llvm_platform: linux-arm64
            llvm_sha256_variable: CORGI_LLVM_TOOLS_SHA256_LINUX_ARM64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify release tag
        id: version
        run: |
          set -euo pipefail
          version="$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["package"]["version"])')"
          test "$GITHUB_REF_NAME" = "v${version}"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap zstd
          # Ubuntu 24.04's AppArmor policy blocks unprivileged user namespaces.
          # This runner is ephemeral; Corgi still requires Bubblewrap's sandbox.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Corgi provisions these llvm-tools (libclang plus the libstdc++ it
      # links) when a Linux build uses bindgen. The script is idempotent and
      # exports CORGI_LLVM_TOOLS_SHA256_LINUX_<ARCH>, which the release build
      # embeds to pin the download.
      - name: Ensure llvm-tools release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
          PLATFORM: ${{ matrix.llvm_platform }}
        run: ./ci/build-libclang.sh

      - name: Build Corgi
        run: |
          rustup set profile minimal
          cargo build --locked

      - name: Build release asset
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ matrix.target }}
          SHA256_VARIABLE: ${{ matrix.llvm_sha256_variable }}
        run: |
          set -euo pipefail
          target="$TARGET"
          host="$(rustc -vV | sed -n 's/^host: //p')"
          test "$host" = "$target"
          llvm_sha256="${!SHA256_VARIABLE:-}"
          test -n "$llvm_sha256" || { echo "the llvm-tools step must export $SHA256_VARIABLE" >&2; exit 1; }

          ./target/debug/corgi build --release

          asset="corgi-${target}.tar.gz"
          mkdir -p dist/archive dist/verify
          cp target/release/corgi dist/archive/corgi
          strip dist/archive/corgi
          tar -czf "dist/${asset}" -C dist/archive corgi
          (
            cd dist
            sha256sum "$asset" > "${asset}.sha256"
          )

          tar -xzf "dist/${asset}" -C dist/verify
          test "$(dist/verify/corgi --version)" = "corgi ${VERSION}"
          # corgi.toml must forward the pin; without it the binary would
          # download llvm-tools unverified.
          grep -qF "$llvm_sha256" dist/verify/corgi

      - uses: actions/upload-artifact@v4
        with:
          name: corgi-${{ matrix.target }}
          path: |
            dist/corgi-${{ matrix.target }}.tar.gz
            dist/corgi-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: Publish Corgi
    needs: build-linux
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Verify release tag
        id: version
        run: |
          set -euo pipefail
          version="$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["package"]["version"])')"
          test "$GITHUB_REF_NAME" = "v${version}"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Ensure Metal release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
          DRY_RUN: "0"
        run: python3 ci/build-metal.py

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      # Corgi provisions these llvm-tools (libclang plus dsymutil)
      # unconditionally on Apple hosts, so a released Corgi is only functional
      # once the artifact for the pinned Zig version exists. Reconcile it before
      # building: the script is idempotent and exits in seconds when the artifact
      # is already published, and only does real work (and installs zstd) after a
      # Zig bump.
      - name: Ensure llvm-tools release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
        run: ./ci/build-libclang.sh

      - name: Build Corgi
        run: cargo build --locked

      - name: Configure private cache reads
        env:
          CORGI_R2_ACCESS_KEY_ID: ${{ secrets.CORGI_R2_ACCESS_KEY_ID }}
          CORGI_R2_SECRET_ACCESS_KEY: ${{ secrets.CORGI_R2_SECRET_ACCESS_KEY }}
        run: python3 ci/configure-cache-credentials.py

      - name: Run tests and populate the cache
        env:
          CORGI_R2_WRITE_URL: https://9a5426ad4c05881db7cff829de5f13e4.r2.cloudflarestorage.com/corgi-build-cache
          CORGI_R2_ACCESS_KEY_ID: ${{ secrets.CORGI_R2_ACCESS_KEY_ID }}
          CORGI_R2_SECRET_ACCESS_KEY: ${{ secrets.CORGI_R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          : "${CORGI_R2_ACCESS_KEY_ID:?Configure the bucket-scoped R2 access key}"
          : "${CORGI_R2_SECRET_ACCESS_KEY:?Configure the bucket-scoped R2 secret key}"
          ./target/debug/corgi cache test

      - name: Build release asset
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          target="aarch64-apple-darwin"
          host="$(rustc -vV | sed -n 's/^host: //p')"
          test "$host" = "$target"

          ./target/debug/corgi build --release

          asset="corgi-${target}.tar.gz"
          mkdir -p dist/archive dist/verify
          cp target/release/corgi dist/archive/corgi
          strip dist/archive/corgi
          codesign --verify dist/archive/corgi
          COPYFILE_DISABLE=1 tar -czf "dist/${asset}" -C dist/archive corgi
          (
            cd dist
            shasum -a 256 "$asset" > "${asset}.sha256"
          )

          tar -xzf "dist/${asset}" -C dist/verify
          test "$(dist/verify/corgi --version)" = "corgi ${VERSION}"

      - uses: actions/download-artifact@v4
        with:
          pattern: corgi-*-unknown-linux-gnu
          path: dist
          merge-multiple: true

      - name: Recreate draft GitHub release from the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if existing="$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [ "$existing" != true ]; then
              echo "Refusing to replace the published release $tag" >&2
              exit 1
            fi
            # A previous attempt may have left a draft with assets from another
            # build. Delete the draft, but keep the immutable release tag.
            gh release delete "$tag" --yes
          fi
          assets=()
          for target in aarch64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            assets+=("dist/corgi-${target}.tar.gz" "dist/corgi-${target}.tar.gz.sha256")
          done
          gh release create "$tag" \
            "${assets[@]}" \
            --draft \
            --verify-tag \
            --target "$GITHUB_SHA" \
            --title "Corgi ${VERSION}" \
            --notes "Automated Corgi release ${VERSION}."

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish ${{ steps.version.outputs.version }}
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release edit "v${VERSION}" --draft=false
