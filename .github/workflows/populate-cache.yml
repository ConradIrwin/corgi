name: Populate Corgi build cache

on:
  workflow_dispatch:
    inputs:
      store-path:
        description: "Canonical store path (override for an isolated CI/local verification)"
        required: true
        default: /Users/Shared/corgi
        type: string

permissions:
  contents: read

concurrency:
  group: corgi-build-cache
  cancel-in-progress: false

jobs:
  populate:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CORGI_STORE: ${{ inputs.store-path }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Build the cache publisher with the pinned Rust toolchain
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          cargo build --locked --target-dir "$RUNNER_TEMP/corgi-bootstrap"

      - name: Populate build results
        env:
          CORGI_R2_WRITE_URL: https://9a5426ad4c05881db7cff829de5f13e4.r2.cloudflarestorage.com/corgi-build-cache
          CORGI_R2_ACCESS_KEY_ID: ${{ secrets.CORGI_R2_ACCESS_KEY_ID }}
          CORGI_R2_SECRET_ACCESS_KEY: ${{ secrets.CORGI_R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          : "${CORGI_R2_ACCESS_KEY_ID:?Configure the bucket-scoped R2 access key}"
          : "${CORGI_R2_SECRET_ACCESS_KEY:?Configure the bucket-scoped R2 secret key}"
          corgi="$RUNNER_TEMP/corgi-bootstrap/debug/corgi"
          "$corgi" cache build --no-incremental

      - name: Verify cold public cache reuse
        run: |
          set -euo pipefail
          corgi="$RUNNER_TEMP/corgi-bootstrap/debug/corgi"
          "$corgi" clean --cache
          "$corgi" fetch
          "$corgi" build
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          reports = list(Path(os.environ["CORGI_STORE"], "reports").glob("*.json"))
          assert len(reports) == 1, reports
          report = json.loads(reports[0].read_text())
          root = next(unit for unit in report["units"] if unit["action"]["is_root"])
          assert root["cache"]["probe"] == "remote", root["cache"]
          print("Verified final executable reused through the public endpoint")
          PY

      - name: Retain cold cache verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corgi-cold-cache-report
          path: ${{ env.CORGI_STORE }}/reports/*.json
          if-no-files-found: ignore

      - name: Populate successful test results
        env:
          CORGI_R2_WRITE_URL: https://9a5426ad4c05881db7cff829de5f13e4.r2.cloudflarestorage.com/corgi-build-cache
          CORGI_R2_ACCESS_KEY_ID: ${{ secrets.CORGI_R2_ACCESS_KEY_ID }}
          CORGI_R2_SECRET_ACCESS_KEY: ${{ secrets.CORGI_R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          corgi="$RUNNER_TEMP/corgi-bootstrap/debug/corgi"
          "$corgi" cache test --no-incremental

      - name: Retain build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corgi-cache-reports
          path: ${{ env.CORGI_STORE }}/reports/*.json
          if-no-files-found: ignore
