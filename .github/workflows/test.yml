name: Test Corgi

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  unit:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Build Corgi
        run: cargo build --locked
      - name: Run unit tests
        run: ./target/debug/corgi test --bin corgi

  integration:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Build Corgi
        run: cargo build --locked
      - name: Configure private cache reads
        env:
          CORGI_R2_ACCESS_KEY_ID: ${{ secrets.CORGI_R2_ACCESS_KEY_ID }}
          CORGI_R2_SECRET_ACCESS_KEY: ${{ secrets.CORGI_R2_SECRET_ACCESS_KEY }}
        run: python3 ci/configure-cache-credentials.py
      - name: Run end-to-end tests
        env:
          CORGI_STORE: ${{ runner.temp }}/corgi-integration
          CORGI_TEST_SHARED_STORE: ${{ runner.temp }}/corgi-integration
        run: |
          set -euo pipefail
          (
            while true; do
              printf 'CPU sample %s ' "$(date -u +%H:%M:%S)"
              ps -A -o comm= -o %cpu= | awk '
                {
                  cpu = $NF
                  if ($0 ~ /rustc/) rustc += cpu
                  else if ($0 ~ /corgi/) corgi += cpu
                  else if ($0 ~ /curl/) curl += cpu
                  else if ($0 ~ /tar/) tar += cpu
                  else if ($0 ~ /python/) python += cpu
                  total += cpu
                }
                END {
                  printf "total=%.0f%% rustc=%.0f%% corgi=%.0f%% curl=%.0f%% tar=%.0f%% python=%.0f%%\n",
                    total, rustc, corgi, curl, tar, python
                }'
              sleep 30
            done
          ) &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          ./target/debug/corgi --verbose test --test end_to_end
