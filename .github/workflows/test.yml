name: Test Corgi

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  unit:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Build Corgi
        run: cargo build --locked
      - name: Run unit tests
        run: ./target/debug/corgi test --bin corgi

  integration:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Build Corgi
        run: cargo build --locked
      - name: Configure private cache reads
        env:
          CORGI_R2_ACCESS_KEY_ID: ${{ secrets.CORGI_R2_ACCESS_KEY_ID }}
          CORGI_R2_SECRET_ACCESS_KEY: ${{ secrets.CORGI_R2_SECRET_ACCESS_KEY }}
        run: python3 ci/configure-cache-credentials.py
      - name: Run end-to-end tests
        env:
          CORGI_STORE: ${{ runner.temp }}/corgi-integration
          CORGI_TEST_SHARED_STORE: ${{ runner.temp }}/corgi-integration
        run: ./target/debug/corgi test --test end_to_end

  linux-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Install Bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu 24.04's AppArmor policy blocks unprivileged user namespaces.
          # This runner is ephemeral; Corgi still requires Bubblewrap's sandbox.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build bootstrap Corgi
        run: |
          rustup set profile minimal
          cargo build --locked --bin corgi

      - name: Self-host and compile C in the sandbox
        run: bash ci/linux-smoke.sh
