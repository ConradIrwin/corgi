name: Deploy site to GitHub Pages

# Run manually from the Actions tab (or `gh workflow run pages.yml`).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Don't let two deploys race; let an in-flight one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # Renders README.md into site/template.html, writing _site/.
      - run: |
          pip install 'markdown-it-py>=3'
          python site/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
