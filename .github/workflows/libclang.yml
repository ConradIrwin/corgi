name: Ensure libclang artifact

# Reconcile the pinned Zig version with a published libclang release asset.
# Runs on every push to main and can be triggered by hand. It does nothing
# unless the artifact for the current pinned Zig version is missing — i.e. it
# only builds after a Zig bump.
on:
  push:
    branches:
      - main
    paths:
      - src/zig.rs
      - ci/build-libclang.sh
      - ci/verify-libclang.sh
      - .github/workflows/libclang.yml
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

jobs:
  ensure-libclang:
    name: Ensure libclang for pinned Zig
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install zstd
        run: |
          if ! command -v zstd >/dev/null; then
            brew install zstd
          fi

      - name: Reconcile libclang release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
        run: ./ci/build-libclang.sh
