[package]
name = "corgi-build"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "PoC: deterministic, content-addressed, lock-free cargo-compatible build tool"
license = "MIT"
repository = "https://github.com/ConradIrwin/corgi"
readme = "README.md"

[[bin]]
name = "corgi"
path = "src/main.rs"

[[test]]
name = "end_to_end"
path = "tests/end_to_end.rs"

[dependencies]
anyhow = "1"
cargo-zigbuild = { version = "=0.23.0", default-features = false }
clap = { version = "4.5", default-features = false, features = [
    "derive",
    "error-context",
    "help",
    "std",
    "usage",
] }
glob = "0.3"
jobserver = "0.1.35"
libc = "0.2"
memchr = "2.8.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.11.0"
tar = { version = "0.4", default-features = false }
toml = "0.8"
toml_edit = "0.22"
zstd = { version = "0.13", default-features = false }

[profile.release]
codegen-units = 1
panic = "abort"
