[package]
name = "corgi-build"
version = "0.1.0"
edition = "2021"
description = "PoC: deterministic, content-addressed, lock-free cargo-compatible build tool"
license = "MIT"
repository = "https://github.com/ConradIrwin/corgi"
readme = "README.md"

[[bin]]
name = "corgi"
path = "src/main.rs"

[dependencies]
anyhow = "1"
jobserver = "0.1.35"
memchr = "2.8.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
toml = "0.8"
